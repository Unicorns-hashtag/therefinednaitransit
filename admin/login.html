<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nai's Transit</title>

    <link rel="stylesheet" href="/assets/css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

</head>

<body>

    <div class="container">

        <!-- LEFT SECTION -->
        <div class="left-section">

            <div class="content">

                <h1>Welcome Back</h1>

                <p>
                    Manage transport routes, fares, passengers and reports from a single platform.
                </p>

                <img src="/images/bus.png" alt="bus">

            </div>

        </div>


        <!-- RIGHT SECTION -->
        <div class="right-section">

            <div class="login-box">

                <h2>Login</h2>

                <form id="loginForm">

                    <div class="input-group">

                        <label>Email Address</label>

                        <input type="email" id="email" placeholder="Enter your email" required>

                    </div>


                    <div class="input-group">

                        <label>Password</label>

                        <input type="password" id="password" placeholder="Enter your password" required>

                    </div>


                    <!-- REMEMBER ME -->
                    <div class="remember">

                        <input type="checkbox" id="rememberMe">

                        <label for="rememberMe">
                            Remember Me
                        </label>

                    </div>


                    <button type="submit">
                        Login
                    </button>

                </form>


                <div class="links">

                    <a href="/admin/forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <a href="/admin/index.html">
                    Back to Home
                </a>

            </div>

        </div>

    </div>


    <!-- EMAIL MODAL -->
    <div id="emailModal" class="modal">

        <div class="modal-content">

            <span class="close" id="closeEmail">&times;</span>

            <h2>Forgot Password</h2>

            <p>Enter your registered email address.</p>

            <input type="email" id="forgotEmail" placeholder="Email Address">

            <button id="sendOtpBtn">
                Send OTP
            </button>

        </div>

    </div>


    <!-- OTP MODAL -->
    <div id="otpModal" class="modal">

        <div class="modal-content">

            <h2>Verify OTP</h2>

            <p id="otpMessage"></p>

            <input type="text" id="otpInput" maxlength="6" placeholder="Enter 6-digit OTP">

            <button id="verifyOtpBtn">
                Verify OTP
            </button>

        </div>

    </div>


    <!-- NEW PASSWORD MODAL -->
    <div id="passwordModal" class="modal">

        <div class="modal-content">

            <h2>Create New Password</h2>

            <input type="password" id="newPassword" placeholder="New Password">

            <input type="password" id="confirmPassword" placeholder="Confirm Password">

            <button id="savePasswordBtn">
                Save Password
            </button>

        </div>

    </div>


    <script src="/assets/javascript/auth.js"></script>

    <!-- FORGOT PASSWORD SCRIPT -->
    <script src="/assets/javascript/forgot-password.js"></script>

</body>

</html>
