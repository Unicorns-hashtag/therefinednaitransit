<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Nai's Transit</title>

    <link rel="stylesheet" href="/assets/css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="left-section">

            <div class="content">

                <h1>Password Recovery</h1>

                <p>
                    Enter your administrator email address.
                    We'll verify it before allowing you to reset your password.
                </p>

                <img src="/images/bus.png" alt="Bus">

            </div>

        </div>


        <div class="right-section">

            <div class="login-box">

                <h2>Forgot Password</h2>

                <form id="forgotForm">

                    <div class="input-group">

                        <label>Email Address</label>

                        <input type="email" id="email" placeholder="Enter your registered email" required>

                    </div>

                    <button type="submit">

                        Send OTP

                    </button>

                </form>

                <br>

                <a href="login.html">
                    Back to Login
                </a>

            </div>

        </div>

    </div>

    <script>

        const form = document.getElementById("forgotForm");

        form.addEventListener("submit", function (e) {

            e.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const user =
                JSON.parse(localStorage.getItem("user"));

            if (!user) {

                alert("No administrator account found.");

                return;

            }

            if (email !== user.email) {

                alert("Email address not found.");

                return;

            }

            // Temporary OTP

            const otp =
                Math.floor(100000 + Math.random() * 900000);

            localStorage.setItem("otp", otp);

            alert("Your OTP is: " + otp);

            window.location.href = "verify-otp.html";

        });

    </script>

</body>

</html>
