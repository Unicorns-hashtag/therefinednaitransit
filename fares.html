</head>

<body>

    <div class="overlay"></div>
    <div class="sidebar">

        <ul>

            <li><a href="/admin/routes.html">Routes</a></li>

        </ul>

    <!-- MAIN CONTENT  -->
    <div class="main">
        <div class="topbar">
            <h2>Fare Management</h2>
        </div>
        <div class="form-box">
            <h3>Add Fare</h3>
            <form id="fareForm">
                <select id="routeName">
                </select>
                <select id="vehicleType">
                    <option>Vehicle Type</option>
                    <option>Bus</option>
                    <option>Mini Bus</option>
                    <option>Luxury Bus</option>
                </select>
                <input type="number" id="fareAmount" placeholder="Fare Amount">
                <button type="submit">Save Fare</button>
            </form>
        </div>
        <div class="table-box">
            <div class="table-header">
                <h3>Fare Records</h3>

                <div class="table-actions">
                    <input type="text" id="fareSearch" placeholder="🔎 Search fares...">

                    <button id="clearFaresBtn" class="clear-btn">
                        Clear Fares
                    </button>
                </div>
            </div>

            <table>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Route</th>
                            <th>Vehicle</th>
                            <th>Fare</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="fareTableBody">
                        <!-- <tr>
                        <td>1</td>
                        <td>Ilaro - Abeokuta</td>
                        <td>Bus</td>
                        <td>₦2,500</td>
                        <td>
                            <button>Edit</button>

                        </td>
                    </tr>
                    <tr>

                        <td>Mini Bus</td>
                        <td>₦1,500</td>
                        <td>
                            <button>Edit</button>
                            <button>Delete</button>
                        </td>
                    </tr> -->
                    </tbody>
                </table>
        </div>
    </div>
    <script src="/assets/javascript/auth.js"></script>
    <script>
        if (!isLoggedIn()) {
            window.location.href = "/admin/login.html";
        }
    </script>
    <script src="/assets/javascript/activity.js"></script>
    <!-- ACTIVITY SYSTEM -->
    <script>
        // ==========================================
        // GET SAVED DATA
        // ==========================================

        let fares = JSON.parse(localStorage.getItem("fares")) || [];
        let routes = JSON.parse(localStorage.getItem("routes")) || [];



        // ==========================================
        // GET HTML ELEMENTS
        // ==========================================

        const fareForm = document.getElementById("fareForm");
        const fareTableBody = document.getElementById("fareTableBody");
        const routeSelect = document.getElementById("routeName");
        const fareSearch = document.getElementById("fareSearch");
        const clearFaresBtn = document.getElementById("clearFaresBtn");


        // ==========================================
        // LOAD ROUTES INTO DROPDOWN
        // ==========================================

        routeSelect.innerHTML =
            '<option value="">Select Route</option>';

        routes.forEach(function (route) {

            routeSelect.innerHTML += `
        <option value="${route.departure} - ${route.destination}">
            ${route.departure} - ${route.destination}
        </option>
       `;

        });


        function displayFares(searchText = "") {

            fareTableBody.innerHTML = "";

            const search = searchText.toLowerCase().trim();

            fares.forEach((fare, index) => {

                const route = fare.route.toLowerCase();
                const vehicle = fare.vehicle.toLowerCase();
                const amount = String(fare.amount);

                const matches =
                    route.includes(search) ||
                    vehicle.includes(search) ||
                    amount.includes(search);

                if (!matches) return;

                fareTableBody.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td>${fare.route}</td>
                <td>${fare.vehicle}</td>
                <td>₦${Number(fare.amount).toLocaleString()}</td>
                <td>
                    <button onclick="deleteFare(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
            });

            if (fareTableBody.innerHTML === "") {

                fareTableBody.innerHTML = `
            <tr>
                <td colspan="5" style="text-align:center;">
                    No matching fares found.
                </td>
            </tr>
        `;
            }
        }


        // ==========================================
        // ADD NEW FARE
        // ==========================================

        fareForm.addEventListener("submit", function (e) {

            e.preventDefault();

            const route =
                document.getElementById("routeName").value;

            const vehicle =
                document.getElementById("vehicleType").value;

            const amount =
                document.getElementById("fareAmount").value;


            // CHECK INPUTS

            if (
                route === "" ||
                vehicle === "Vehicle Type" ||
                amount === ""
            ) {

                alert("Please fill all fields.");

                return;

            }


            // CREATE NEW FARE

            const newFare = {

                route: route,

                vehicle: vehicle,

                amount: amount,

                date: new Date().toLocaleDateString("en-GB")

            };


            // ADD TO ARRAY

            fares.push(newFare);


            // SAVE TO LOCAL STORAGE

            localStorage.setItem(
                "fares",
                JSON.stringify(fares)
            );


            // ADD ACTIVITY

            addActivity(
                "New fare added: " +
                route +
                " - ₦" +
                Number(amount).toLocaleString()
            );


            // RESET FORM

            fareForm.reset();


            // DISPLAY UPDATED TABLE

            displayFares();

        });

        // =========================
        // CLEAR ALL FARES
        // =========================

        clearFaresBtn.addEventListener("click", function () {

            const currentFares =
                JSON.parse(localStorage.getItem("fares")) || [];

            if (currentFares.length === 0) {

                alert("There are no fares to clear.");

                return;
            }

            const confirmClear = confirm(
                "Are you sure you want to clear all fare records?"
            );

            if (!confirmClear) return;

            // Clear only fares

            localStorage.removeItem("fares");

            fares.length = 0;

            displayFares();

            addActivity("All fares cleared");

            alert("All fare records have been cleared successfully.");

        });


        // ==========================================
        // DELETE FARE
        // ==========================================

        function deleteFare(index) {

            const deletedFare = fares[index];

            if (!deletedFare) {
                return;
            }


            if (!confirm("Are you sure you want to delete this fare?")) {
                return;
            }


            fares.splice(index, 1);


            localStorage.setItem(
                "fares",
                JSON.stringify(fares)
            );


            addActivity(
                "Fare deleted: " +
                deletedFare.route +
                " - ₦" +
                Number(deletedFare.amount).toLocaleString()
            );


            displayFares();

        }


        // ==========================================
        // SEARCH FARES
        // ==========================================

        fareSearch.addEventListener("input", function () {

            const searchText =
                fareSearch.value.toLowerCase().trim();


            const filteredFares = fares.filter(function (fare) {

                return (
                    fare.route.toLowerCase().includes(searchText) ||

                    fare.vehicle.toLowerCase().includes(searchText) ||

                    String(fare.amount).includes(searchText)
                );

            });


            displayFares(filteredFares);

        });
        // =========================
        // LIVE SEARCH
        // =========================

        fareSearch.addEventListener("input", function () {

            displayFares(this.value);

        });

        // ==========================================
        // DISPLAY SAVED FARES WHEN PAGE OPENS
        // ==========================================

        displayFares();
    </script>

    <!-- HAMBURGER / SIDEBAR JAVASCRIPT -->
    <script>

        const menuBtn =
            document.getElementById("menuBtn");

        const sidebar =
            document.querySelector(".sidebar");

        const overlay =
            document.querySelector(".overlay");


        // OPEN / CLOSE SIDEBAR

        menuBtn.addEventListener("click", function () {

            sidebar.classList.toggle("show");

            overlay.classList.toggle("active");


            if (sidebar.classList.contains("show")) {

                menuBtn.innerHTML = "✕";

            } else {

                menuBtn.innerHTML = "☰";

            }

        });


        // CLOSE WHEN CLICKING OVERLAY

        overlay.addEventListener("click", function () {

            sidebar.classList.remove("show");

            overlay.classList.remove("active");

            menuBtn.innerHTML = "☰";

        });


        // CLOSE SIDEBAR AFTER CLICKING A LINK

        document.querySelectorAll(".sidebar a").forEach(function (link) {

            link.addEventListener("click", function () {

                sidebar.classList.remove("show");

                overlay.classList.remove("active");

                menuBtn.innerHTML = "☰";

            });

        });

    </script>
</body>

</html>
